server.port=${PORT:8080}
spring.datasource.url=${FILMS_DB_URL:jdbc:postgresql://127.0.0.1:5432/films_lab}
spring.datasource.username=${FILMS_DB_USER:postgres}
spring.datasource.password=${FILMS_DB_PASSWORD:}
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.thymeleaf.cache=false
server.error.include-message=always
